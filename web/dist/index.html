    <title>个人空间 · Change~生活</title>
    <script>
      // 首屏渲染前定好外观，深色用户不会看到白屏一闪（逻辑同 src/theme.ts）
      (function () {
        try {
          var m = localStorage.getItem('qz.mode');
          var dark = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.appearance = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#131412' : '#f7f4ee');
        } catch (e) {}
      })();
    </script>
