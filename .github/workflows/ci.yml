name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 构建前端 + 编译后端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # go:embed 需要 web/dist 先存在，所以顺序不能反
      - name: 构建前端（类型检查 + vite build）
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

      - name: 编译（静态链接，单文件）
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.sha }}" -o dist/qzone-linux-amd64 .
          ls -lh dist/

      - name: 冒烟测试（启动后访问首页）
        run: |
          ./dist/qzone-linux-amd64 -addr 127.0.0.1:8099 -data /tmp/qzdata > /tmp/qzone.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/ || true)
            [ "$code" = "200" ] && echo "首页 200" && exit 0
            sleep 1
          done
          echo "服务未能启动"; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: qzone-linux-amd64
          path: dist/qzone-linux-amd64
          retention-days: 7

  docker:
    name: 构建镜像（不推送）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 校验 Dockerfile 可构建
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
